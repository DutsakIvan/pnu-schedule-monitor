name: Check PNU Schedule Changes

on:
  workflow_dispatch:

  push:
    branches:
      - main

  schedule:
    - cron: '0 */3 * * *'

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository (pnu-schedule-monitor)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper script and capture output
        id: run_script
        run: |
          echo "Running main-scraper.py..."
          python main-scraper.py | tee run_output.log
          echo "Script finished."
          if [ ! -f schedule_data.js ]; then
             echo "::error file=main-scraper.py::File schedule_data.js was not generated!"
             exit 1
          fi
          if grep -q "Знайдено зміни в розкладах:" run_output.log; then
            echo "CHANGES_FOUND=true" >> $GITHUB_ENV
            echo "changes_detected=true" >> $GITHUB_OUTPUT
            echo "Changes detected by script."
          else
            echo "CHANGES_FOUND=false" >> $GITHUB_ENV
            echo "changes_detected=false" >> $GITHUB_OUTPUT
            echo "No changes detected by script."
          fi
        shell: bash

      - name: Extract change summary
        id: extract_summary
        if: steps.run_script.outputs.changes_detected == 'true'
        run: |
          echo "Extracting change summary..."
          SUMMARY=$(sed -n '/Знайдено зміни в розкладах:/,$p' run_output.log | sed '1d' | grep '^\s*-\ ' | sed 's/^- //' | head -c 1000)
          echo "CHANGES_SUMMARY<<EOF" >> $GITHUB_ENV
          echo "$SUMMARY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          echo "Change summary extracted."
        shell: bash

      - name: Commit and push schedule_data.js to pnu-schedule-monitor
        if: steps.run_script.outputs.changes_detected == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Автоматичне оновлення розкладу (pnu-schedule-monitor)"
          file_pattern: schedule_data.js
          commit_user_name: GitHub Actions Bot
          commit_user_email: actions@github.com
          commit_author: GitHub Actions Bot <actions@github.com>

      # === СИНХРОНІЗАЦІЯ З student-pnu-web.github.io ===

      - name: Checkout student-pnu-web.github.io repo
        if: steps.run_script.outputs.changes_detected == 'true'
        uses: actions/checkout@v4
        with:
          repository: DutsakIvan/student-pnu-web.github.io
          path: repo-b
          token: ${{ secrets.REPO_B_PAT }}

      - name: Copy schedule_data.js to repo-b
        if: steps.run_script.outputs.changes_detected == 'true'
        run: |
          echo "Copying schedule_data.js to repo-b..."
          cp ./schedule_data.js ./repo-b/schedule_data.js
          echo "Copy complete."
        shell: bash

      - name: Commit and push changes to student-pnu-web.github.io
        if: steps.run_script.outputs.changes_detected == 'true'
        run: |
          cd repo-b
          git config user.name 'GitHub Actions Bot'
          git config user.email 'actions@github.com'
          git add schedule_data.js
          if git diff --staged --quiet; then
            echo "No actual changes in schedule_data.js. Skipping commit."
          else
            echo "Changes detected. Committing..."
            git commit -m "Автоматичне оновлення schedule_data.js [skip ci]"
            git push origin main
            echo "Push to student-pnu-web.github.io complete."
          fi
        shell: bash

      # === EMAIL СПОВІЩЕННЯ ===

      - name: Send notification email
        if: env.CHANGES_FOUND == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Зміни в розкладі ПНУ!"
          to: clainygameryt@gmail.com
          from: GitHub Actions Bot <${{ secrets.MAIL_USERNAME }}>
          body: |
            Виявлено зміни в розкладі ПНУ!

            Зміни:
            ${{ env.CHANGES_SUMMARY }}

            Перегляньте деталі:
            - Монітор: https://github.com/DutsakIvan/pnu-schedule-monitor
            - Сайт: https://github.com/DutsakIvan/student-pnu-web.github.io
          priority: high
